<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samsung - Historique des Recharges</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f8f9fa;
            color: #000;
            padding-bottom: 30px;
        }

        /* En-tête (Bleu Samsung) */
        .header {
            background-color: #1428A0;
            color: #fff;
            padding: 20px 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }

        .back-btn {
            color: #fff;
            font-size: 18px;
            text-decoration: none;
        }

        .header-title {
            font-size: 16px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .container {
            padding: 15px;
        }

        /* Liste des transactions */
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .history-card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .amount {
            font-size: 16px;
            font-weight: 900;
            color: #1428A0;
        }

        .details {
            font-size: 11px;
            color: #666;
        }

        .date {
            font-size: 10px;
            color: #999;
        }

        /* Badges de Statut (harmonisés en bleu / verts / rouges clairs) */
        .status-badge {
            font-size: 10px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 12px;
            text-transform: uppercase;
        }

        .status-pending {
            background: #eef2ff;
            color: #1428A0;
        }

        .status-approved {
            background: #d4edda;
            color: #155724;
        }

        .status-rejected {
            background: #f8d7da;
            color: #721c24;
        }

        .empty-history {
            background: #fff;
            border: 1px dashed #ccc;
            border-radius: 14px;
            padding: 30px 15px;
            text-align: center;
            color: #777;
            font-size: 13px;
            margin-top: 20px;
        }

        .empty-history i {
            font-size: 30px;
            margin-bottom: 10px;
            color: #1428A0;
        }
    </style>
</head>
<body>

    <!-- En-tête avec retour -->
    <div class="header">
        <a href="profil.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
        <div class="header-title">Samsung - Historique des Recharges</div>
    </div>

    <div class="container">
        <div class="history-list" id="historyContainer">
            <div class="empty-history">
                <i class="fas fa-spinner fa-spin"></i><br>
                Chargement de votre historique...
            </div>
        </div>
    </div>

    <script>
        const dbUrl = "https://canal-e4274-default-rtdb.firebaseio.com";
        const userPhone = localStorage.getItem('userPhone') || '890000000';

        // Fonction pour sécuriser l'affichage du texte (anti-XSS)
        function escapeHtml(str) {
            return String(str || '').replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
            });
        }

        async function loadRechargeHistory() {
            const container = document.getElementById('historyContainer');

            try {
                const res = await fetch(`${dbUrl}/recharges/${encodeURIComponent(userPhone)}.json`);
                
                if (!res.ok) throw new Error("Erreur serveur lors de la requête");
                
                const data = await res.json();

                if (!data || Object.keys(data).length === 0) {
                    container.innerHTML = `
                        <div class="empty-history">
                            <i class="fas fa-receipt"></i><br>
                            Aucune demande de recharge enregistrée.
                        </div>
                    `;
                    return;
                }

                // Trier les recharges de la plus récente à la plus ancienne
                const keys = Object.keys(data).reverse();
                let htmlCards = "";

                keys.forEach(key => {
                    const item = data[key];
                    const dateFormatted = item.createdAt ? new Date(item.createdAt).toLocaleString('fr-FR') : 'Date inconnue';

                    let badgeClass = "status-pending";
                    let statusText = item.status || "En attente";

                    const normalizedStatus = String(item.status).toLowerCase();
                    if (normalizedStatus === "validé" || normalizedStatus === "approved") {
                        badgeClass = "status-approved";
                    } else if (normalizedStatus === "rejeté" || normalizedStatus === "rejected") {
                        badgeClass = "status-rejected";
                    }

                    const amount = Number(item.amount || 0).toLocaleString('fr-FR');
                    const method = escapeHtml(item.method || 'Mobile Money');
                    const recipient = escapeHtml(item.recipientPhone || 'N/A');

                    htmlCards += `
                        <div class="history-card">
                            <div class="card-left">
                                <div class="amount">+ ${amount} FC</div>
                                <div class="details">${method} (Dest: ${recipient})</div>
                                <div class="date">${escapeHtml(dateFormatted)}</div>
                            </div>
                            <div>
                                <span class="status-badge ${badgeClass}">${escapeHtml(statusText)}</span>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = htmlCards;

            } catch (err) {
                console.error("Erreur de chargement :", err);
                container.innerHTML = `
                    <div class="empty-history" style="color: #d93025;">
                        <i class="fas fa-exclamation-triangle"></i><br>
                        Erreur de connexion lors de la récupération des données.
                    </div>
                `;
            }
        }

        window.addEventListener('DOMContentLoaded', loadRechargeHistory);
    </script>
</body>
</html>
