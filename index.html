<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samsung - Authentification</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 30px 20px;
            color: #000;
        }

        .auth-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #ffffff;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        /* Branding Samsung */
        .brand-logo {
            width: 180px;
            height: auto;
            margin-top: 10px;
            margin-bottom: 15px;
        }

        .welcome-text {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 25px;
            color: #1428a0; /* Bleu Samsung */
        }

        /* Selecteur d'onglets (Se connecter / S'inscrire) */
        .tab-box {
            display: flex;
            width: 100%;
            border: 1px solid #1428a0;
            border-radius: 12px;
            padding: 3px;
            margin-bottom: 25px;
            background: #fff;
        }

        .tab-btn {
            flex: 1;
            padding: 12px 0;
            border: none;
            background: transparent;
            font-size: 15px;
            font-weight: 500;
            border-radius: 9px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #1428a0;
            text-align: center;
        }

        .tab-btn.active {
            background: #1428a0;
            color: #fff;
            font-weight: 600;
        }

        /* Formulaires */
        .form-section {
            width: 100%;
            display: none;
            flex-direction: column;
            gap: 15px;
        }

        .form-section.active {
            display: flex;
        }

        .input-box {
            width: 100%;
            background-color: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
        }

        .input-box span.prefix {
            font-weight: bold;
            font-size: 14px;
            margin-right: 10px;
            color: #1428a0;
        }

        .input-box input {
            width: 100%;
            border: none;
            background: transparent;
            outline: none;
            font-size: 14px;
            color: #333;
        }

        .input-box input::placeholder {
            color: #94a3b8;
        }

        /* Captcha visuel - Alignement strict sur 1 seule ligne */
        .captcha-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .captcha-code {
            background-color: #e0e7ff;
            padding: 10px 14px;
            border-radius: 8px;
            font-family: monospace;
            font-weight: 900;
            font-size: 18px;
            letter-spacing: 5px;
            color: #1428a0;
            user-select: none;
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 120px;
        }

        /* Bouton de validation Samsung */
        .submit-btn {
            width: 100%;
            background-color: #1428a0;
            color: #fff;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(20, 40, 160, 0.25);
            transition: background-color 0.2s, opacity 0.2s;
        }

        .submit-btn:hover {
            background-color: #0f1e7a;
        }

        .submit-btn:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <!-- Logo Officiel Samsung (SVG Vectoriel) -->
        <svg class="brand-logo" viewBox="0 0 200 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M28.1 19.3c-1.3-.8-3.1-1.3-4.8-1.7-2.1-.5-3.3-.9-3.3-1.8 0-.8.8-1.3 2.1-1.3 1.6 0 3.7.5 5.2 1.3l1.8-3.9C27.1 10.8 24.3 10 21.7 10c-5.2 0-8.8 2.8-8.8 7.3 0 4.3 3.3 6 6.8 6.9 2.3.6 3.6 1.1 3.6 2 0 .9-.9 1.5-2.5 1.5-2.1 0-4.6-.8-6.4-1.9l-1.9 4c2.2 1.4 5.3 2.2 8.2 2.2 5.8 0 9.4-2.8 9.4-7.5 0-3.8-2.6-5.8-6-6.7zM42.2 10.5h-5.2l-6.8 21.1h5.3l1.2-4.1h6l1.2 4.1h5.3l-7-21.1zm-4.3 13.1l1.8-6.1 1.8 6.1h-3.6zm29.8-13.1h-5.3l-4.1 13-4.1-13h-5.3v21.1h4.8v-13l3.8 13h1.6l3.8-13v13h4.8V10.5zm19.9 8.8c-1.3-.8-3.1-1.3-4.8-1.7-2.1-.5-3.3-.9-3.3-1.8 0-.8.8-1.3 2.1-1.3 1.6 0 3.7.5 5.2 1.3l1.8-3.9C86.7 10.8 83.9 10 81.3 10c-5.2 0-8.8 2.8-8.8 7.3 0 4.3 3.3 6 6.8 6.9 2.3.6 3.6 1.1 3.6 2 0 .9-.9 1.5-2.5 1.5-2.1 0-4.6-.8-6.4-1.9l-1.9 4c2.2 1.4 5.3 2.2 8.2 2.2 5.8 0 9.4-2.8 9.4-7.5 0-3.8-2.6-5.8-6-6.7zm18.3-8.8v13.5c0 2.8-1.5 4.3-4.2 4.3s-4.2-1.5-4.2-4.3V10.5h-5.2v13.8c0 5.4 3.7 8.1 9.4 8.1s9.4-2.7 9.4-8.1V10.5h-5.2zm28.3 0h-5.3l-4.1 13-4.1-13h-5.3v21.1h4.8v-13l3.8 13h1.6l3.8-13v13h4.8V10.5zm20.8 10.5c0-6.2-4.2-10.5-10.4-10.5-6.3 0-10.5 4.4-10.5 10.6 0 6 4.1 10.6 10.4 10.6 3.6 0 6.6-1.4 8.6-3.8l-3.3-2.9c-1.2 1.4-2.9 2.1-5.1 2.1-3.3 0-5.4-2.2-5.4-5.6h15.6c0-.2.1-.3.1-.5zm-15.6-2.1c.3-2.9 2.3-4.7 5.2-4.7 2.9 0 4.9 1.8 5.2 4.7h-10.4z" fill="#1428A0"/>
        </svg>

        <div class="welcome-text">Bienvenue !</div>

        <!-- Boutons de permutation -->
        <div class="tab-box">
            <button class="tab-btn active" id="tabLoginBtn" onclick="switchTab('login')">Se connecter</button>
            <button class="tab-btn" id="tabRegisterBtn" onclick="switchTab('register')">S'inscrire</button>
        </div>

        <!-- FORMULAIRE SE CONNECTER -->
        <form class="form-section active" id="loginForm" onsubmit="handleLogin(event)">
            <div class="input-box">
                <span class="prefix">+243</span>
                <input type="tel" id="loginPhone" placeholder="Saisir le numéro de compte" required>
            </div>
            <div class="input-box">
                <input type="password" id="loginPassword" placeholder="Entrez votre mot de passe" required>
            </div>
            <button type="submit" class="submit-btn">Se connecter</button>
        </form>

        <!-- FORMULAIRE S'INSCRIRE -->
        <form class="form-section" id="registerForm" onsubmit="handleRegister(event)">
            <div class="input-box">
                <span class="prefix">+243</span>
                <input type="tel" id="regPhone" placeholder="Saisir le numéro de compte" required>
            </div>
            <div class="input-box">
                <input type="password" id="regPassword" placeholder="Entrez votre mot de passe" required>
            </div>
            <div class="input-box">
                <input type="password" id="regConfirmPassword" placeholder="Saisir à nouveau le mot de passe" required>
            </div>
            <div class="input-box captcha-wrapper">
                <input type="text" id="regCaptchaInput" placeholder="Entrez le code" required>
                <div class="captcha-code" id="captchaDisplay" onclick="generateCaptcha()" title="Cliquer pour changer">----</div>
            </div>
            <div class="input-box">
                <input type="text" id="regRefCode" placeholder="Code d'invitation (Optionnel)">
            </div>
            <button type="submit" class="submit-btn">S'inscrire</button>
        </form>
    </div>

    <script>
        const dbUrl = "https://canal-e4274-default-rtdb.firebaseio.com";
        let currentCaptcha = "";

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const refParam = urlParams.get('ref');
            if (refParam) {
                document.getElementById('regRefCode').value = refParam;
                switchTab('register');
            }
            generateCaptcha();
        };

        function switchTab(tab) {
            const loginBtn = document.getElementById('tabLoginBtn');
            const registerBtn = document.getElementById('tabRegisterBtn');
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');

            if (tab === 'login') {
                loginBtn.classList.add('active');
                registerBtn.classList.remove('active');
                loginForm.classList.add('active');
                registerForm.classList.remove('active');
            } else {
                registerBtn.classList.add('active');
                loginBtn.classList.remove('active');
                registerForm.classList.add('active');
                loginForm.classList.remove('active');
                generateCaptcha();
            }
        }

        function generateCaptcha() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            let result = "";
            for (let i = 0; i < 4; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            currentCaptcha = result;
            document.getElementById('captchaDisplay').innerText = result;
        }

        function generateInviteCode() {
            const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            let code = "";
            for (let i = 0; i < 6; i++) {
                code += letters.charAt(Math.floor(Math.random() * letters.length));
            }
            return code;
        }

        async function handleLogin(e) {
            e.preventDefault();
            const phone = document.getElementById('loginPhone').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!phone || !password) {
                alert("Veuillez remplir tous les champs.");
                return;
            }

            try {
                const res = await fetch(`${dbUrl}/users/${phone}.json`);
                const user = await res.json();

                if (!user) {
                    alert("Compte inexistant. Veuillez d'abord vous inscrire.");
                    return;
                }

                if (user.password !== password) {
                    alert("Mot de passe incorrect.");
                    return;
                }

                localStorage.setItem('userPhone', phone);
                alert("Connexion réussie !");
                window.location.href = "dashboard.html";

            } catch (err) {
                console.error(err);
                alert("Erreur réseau. Veuillez réessayer.");
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const phone = document.getElementById('regPhone').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;
            const captchaInput = document.getElementById('regCaptchaInput').value.trim().toUpperCase();
            const refCode = document.getElementById('regRefCode').value.trim();

            if (password !== confirmPassword) {
                alert("Les mots de passe ne correspondent pas.");
                return;
            }

            if (captchaInput !== currentCaptcha) {
                alert("Code captcha incorrect.");
                generateCaptcha();
                return;
            }

            try {
                const checkRes = await fetch(`${dbUrl}/users/${phone}.json`);
                const existingUser = await checkRes.json();

                if (existingUser) {
                    alert("Ce numéro de téléphone est déjà inscrit.");
                    return;
                }

                const myInviteCode = generateInviteCode();

                const newUser = {
                    phone: phone,
                    password: password,
                    balance: 0,
                    inviteCode: myInviteCode,
                    referredBy: refCode || "",
                    createdAt: new Date().toISOString()
                };

                await fetch(`${dbUrl}/users/${phone}.json`, {
                    method: 'PUT',
                    body: JSON.stringify(newUser)
                });

                localStorage.setItem('userPhone', phone);
                alert("Inscription réussie !");
                window.location.href = "dashboard.html";

            } catch (err) {
                console.error(err);
                alert("Erreur lors de l'inscription. Veuillez réessayer.");
            }
        }
    </script>
</body>
</html>
